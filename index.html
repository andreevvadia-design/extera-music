<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>exteraMusic</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #0f1013);
      --surface-color: var(--tg-theme-secondary-bg-color, #18191f);
      --surface-variant: #252730;
      --text-color: var(--tg-theme-text-color, #f4f5f8);
      --text-muted: var(--tg-theme-hint-color, #8d919d);
      --accent-color: var(--tg-theme-button-color, #c280ff);
      --accent-gradient: linear-gradient(135deg, #a855f7, #6366f1);
      --accent-text: #ffffff;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Roboto", "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 125px;
    }

    /* Верхняя панель */
    header {
      padding: 16px 18px 10px;
      position: sticky;
      top: 0;
      background: rgba(15, 16, 19, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 50;
    }

    .app-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .app-title span {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      background: var(--surface-color);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s ease;
    }

    .search-box:focus-within {
      border-color: #a855f7;
      box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.25);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-color);
      font-size: 15px;
      width: 100%;
      margin-left: 10px;
    }

    /* Блок артистов */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin: 16px 18px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 12px;
    }

    .artists-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding: 0 18px 8px;
      scrollbar-width: none;
    }

    .artists-scroll::-webkit-scrollbar {
      display: none;
    }

    .artist-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      flex-shrink: 0;
      width: 82px;
      transition: transform 0.15s ease;
    }

    .artist-card:active {
      transform: scale(0.92);
    }

    .artist-avatar {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: var(--surface-color);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #fff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
      background-size: cover;
      background-position: center;
    }

    .artist-card.active .artist-avatar {
      border-color: #a855f7;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.5);
    }

    .artist-name {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      color: var(--text-color);
    }

    /* Список треков */
    .track-list {
      padding: 8px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      background: var(--surface-color);
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.03);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .track-item:active {
      transform: scale(0.98);
      background: var(--surface-variant);
    }

    .track-cover {
      width: 50px;
      height: 50px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      margin-right: 14px;
      background: var(--surface-variant);
    }

    .track-info {
      flex: 1;
      min-width: 0;
    }

    .track-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Нижний мини-плеер */
    .mini-player {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(24, 25, 31, 0.95);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
      z-index: 100;
    }

    .player-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-cover {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      object-fit: cover;
    }

    .play-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
    }

    .progress-bar-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-time {
      font-size: 11px;
      color: var(--text-muted);
      width: 32px;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: var(--surface-variant);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-gradient);
      border-radius: 2px;
      width: 0%;
    }

    .placeholder-state {
      text-align: center;
      color: var(--text-muted);
      margin-top: 30px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">extera<span>Music</span></div>
    <div class="search-box">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <input type="text" id="searchInput" placeholder="Поиск трека или рэпера..." autocomplete="off">
    </div>
  </header>

  <!-- Карусель артистов -->
  <div class="section-title">
    <span>Популярные артисты</span>
  </div>
  <div class="artists-scroll" id="artistsList">
    <!-- Генерируется скриптом -->
  </div>

  <div class="section-title">
    <span id="currentSectionTitle">Треки</span>
  </div>

  <!-- Список треков -->
  <div class="track-list" id="trackList">
    <div class="placeholder-state">Загружаем подборку...</div>
  </div>

  <!-- Плеер -->
  <div class="mini-player" id="player" style="display: none;">
    <div class="player-main">
      <img id="pCover" class="player-cover" src="" alt="cover">
      <div class="track-info">
        <div id="pTitle" class="track-name">—</div>
        <div id="pArtist" class="track-artist">—</div>
      </div>
      <button class="play-btn" id="playBtn">▶</button>
    </div>
    <div class="progress-bar-container">
      <span class="progress-time" id="curTime">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress-time" id="totalTime">0:00</span>
    </div>
  </div>

  <audio id="audioElement"></audio>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0f1013');
    }

    // Список артистов
    const RU_RAPPERS = [
      { name: "MADKID", color: "linear-gradient(135deg, #f43f5e, #be123c)" },
      { name: "Тёмный Принц", color: "linear-gradient(135deg, #6366f1, #3b82f6)" },
      { name: "Kai Angel", color: "linear-gradient(135deg, #a855f7, #ec4899)" },
      { name: "9mice", color: "linear-gradient(135deg, #14b8a6, #06b6d4)" },
      { name: "Toxi$", color: "linear-gradient(135deg, #eab308, #f97316)" },
      { name: "Heronwater", color: "linear-gradient(135deg, #10b981, #047857)" },
      { name: "Bushido Zho", color: "linear-gradient(135deg, #f97316, #dc2626)" },
      { name: "Платина", color: "linear-gradient(135deg, #8b5cf6, #4338ca)" },
      { name: "OG Buda", color: "linear-gradient(135deg, #3b82f6, #1d4ed8)" },
      { name: "Big Baby Tape", color: "linear-gradient(135deg, #e11d48, #9f1239)" },
      { name: "Saluki", color: "linear-gradient(135deg, #64748b, #334155)" }
    ];

    const artistsList = document.getElementById('artistsList');
    const searchInput = document.getElementById('searchInput');
    const trackList = document.getElementById('trackList');
    const currentSectionTitle = document.getElementById('currentSectionTitle');
    const player = document.getElementById('player');
    const pCover = document.getElementById('pCover');
    const pTitle = document.getElementById('pTitle');
    const pArtist = document.getElementById('pArtist');
    const playBtn = document.getElementById('playBtn');
    const audio = document.getElementById('audioElement');
    const progressFill = document.getElementById('progressFill');
    const progressBar = document.getElementById('progressBar');
    const curTime = document.getElementById('curTime');
    const totalTime = document.getElementById('totalTime');

    let isPlaying = false;
    let searchTimeout;

    // Отрисовка карточек артистов
    function initArtists() {
      artistsList.innerHTML = '';
      RU_RAPPERS.forEach((artist, index) => {
        const card = document.createElement('div');
        card.className = `artist-card ${index === 0 ? 'active' : ''}`;
        
        // Первая буква для аватара
        const initials = artist.name.substring(0, 2).toUpperCase();

        card.innerHTML = `
          <div class="artist-avatar" style="background: ${artist.color}">${initials}</div>
          <div class="artist-name">${artist.name}</div>
        `;

        card.addEventListener('click', () => {
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
          document.querySelectorAll('.artist-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          searchInput.value = artist.name;
          currentSectionTitle.textContent = `Треки ${artist.name}`;
          searchTracks(artist.name);
        });

        artistsList.appendChild(card);
      });
    }

    initArtists();

    // Загружаем треки первого артиста (MADKID) по умолчанию при старте
    searchTracks("MADKID");

    // Живой поиск при вводе
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      const query = e.target.value.trim();
      if (!query) {
        currentSectionTitle.textContent = "Треки";
        searchTracks("MADKID");
        return;
      }

      searchTimeout = setTimeout(() => {
        document.querySelectorAll('.artist-card').forEach(c => c.classList.remove('active'));
        currentSectionTitle.textContent = `Результаты для «${query}»`;
        searchTracks(query);
      }, 400);
    });

    async function searchTracks(query) {
      trackList.innerHTML = '<div class="placeholder-state">🔍 Загрузка треков...</div>';
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=35`);
        const data = await res.json();

        if (!data.results || data.results.length === 0) {
          trackList.innerHTML = '<div class="placeholder-state">Ничего не найдено</div>';
          return;
        }

        renderTracks(data.results);
      } catch (err) {
        trackList.innerHTML = '<div class="placeholder-state">Ошибка загрузки треков</div>';
      }
    }

    function renderTracks(tracks) {
      trackList.innerHTML = '';
      tracks.forEach(track => {
        if (!track.previewUrl) return;

        const item = document.createElement('div');
        item.className = 'track-item';
        const cover = (track.artworkUrl100 || '').replace('100x100bb', '300x300bb');

        item.innerHTML = `
          <img class="track-cover" src="${cover}" alt="cover" loading="lazy">
          <div class="track-info">
            <div class="track-name">${track.trackName}</div>
            <div class="track-artist">${track.artistName}</div>
          </div>
        `;

        item.addEventListener('click', () => {
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
          playTrack({
            title: track.trackName,
            artist: track.artistName,
            cover: cover,
            audioUrl: track.previewUrl
          });
        });

        trackList.appendChild(item);
      });
    }

    function playTrack(track) {
      player.style.display = 'flex';
      pTitle.textContent = track.title;
      pArtist.textContent = track.artist;
      pCover.src = track.cover;
      audio.src = track.audioUrl;
      audio.play();
      isPlaying = true;
      playBtn.textContent = '⏸';
    }

    playBtn.addEventListener('click', () => {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      if (isPlaying) {
        audio.pause();
        playBtn.textContent = '▶';
      } else {
        audio.play();
        playBtn.textContent = '⏸';
      }
      isPlaying = !isPlaying;
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const progress = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = progress + '%';
      curTime.textContent = formatTime(audio.currentTime);
      totalTime.textContent = formatTime(audio.duration);
    });

    progressBar.addEventListener('click', (e) => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const percent = clickX / rect.width;
      audio.currentTime = percent * audio.duration;
    });

    audio.addEventListener('ended', () => {
      isPlaying = false;
      playBtn.textContent = '▶';
      progressFill.style.width = '0%';
    });

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
  </script>
</body>
</html>
