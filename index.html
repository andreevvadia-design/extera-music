<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Spotify x exteraMusic • 500 Artists</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #181818;
      --hover: #262626;
      --green: #1ed760;
      --text: #ffffff;
      --muted: #b3b3b3;
      --border: rgba(255, 255, 255, 0.08);
      --b-nav: 64px;
      --p-h: 74px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Circular", Roboto, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; padding-bottom: calc(var(--b-nav) + var(--p-h) + 12px); overflow-x: hidden; }
    
    .top-header { padding: 18px 16px 10px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(18,18,18,0.96); backdrop-filter: blur(20px); z-index: 50; }
    .greeting { font-size: 22px; font-weight: 800; }
    
    .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 16px 14px; }
    .quick-item { display: flex; align-items: center; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; cursor: pointer; height: 52px; }
    .quick-item:active { transform: scale(0.98); background: rgba(255,255,255,0.15); }
    .quick-img { width: 52px; height: 52px; object-fit: cover; flex-shrink: 0; background: #282828; }
    .quick-name { font-size: 13px; font-weight: 700; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

    .sec-head { display: flex; justify-content: space-between; align-items: flex-end; padding: 16px 16px 8px; }
    .sec-title { font-size: 18px; font-weight: 800; }
    .sec-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .pills { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
    .pills::-webkit-scrollbar { display: none; }
    .pill { padding: 6px 14px; border-radius: 20px; background: #222; color: var(--muted); border: 1px solid var(--border); font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .pill.active { background: var(--green); color: #000; border-color: var(--green); }

    .scroll-row { display: flex; gap: 14px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; }
    .scroll-row::-webkit-scrollbar { display: none; }

    .artist-c { display: flex; flex-direction: column; align-items: center; width: 100px; flex-shrink: 0; cursor: pointer; text-align: center; }
    .artist-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 8px; background: #242424; box-shadow: 0 6px 16px rgba(0,0,0,0.5); }
    .artist-name { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

    .card { background: var(--card); border-radius: 8px; padding: 12px; width: 140px; flex-shrink: 0; cursor: pointer; display: flex; flex-direction: column; }
    .card:active { transform: scale(0.96); background: var(--hover); }
    .card-wrap { position: relative; width: 100%; padding-top: 100%; border-radius: 6px; overflow: hidden; margin-bottom: 8px; background: #242424; }
    .card-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .card-t { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-d { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .hero { position: relative; height: 300px; background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 16px; }
    .hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--bg) 15%, rgba(18,18,18,0.6) 65%, transparent 100%); }
    .hero-body { position: relative; z-index: 2; }
    .hero-name { font-size: 34px; font-weight: 900; line-height: 1.1; margin-bottom: 4px; }
    .hero-stat { font-size: 13px; color: #ddd; margin-bottom: 14px; }
    .play-big { width: 50px; height: 50px; border-radius: 50%; background: var(--green); color: #000; border: none; font-size: 20px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 6px 20px rgba(30,215,96,0.4); }

    .t-list { padding: 8px 16px; display: flex; flex-direction: column; gap: 6px; }
    .t-row { display: flex; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
    .t-row:active { background: rgba(255,255,255,0.08); }
    .t-idx { width: 26px; font-size: 14px; font-weight: 700; color: var(--muted); }
    .t-idx.top3 { color: var(--green); }
    .t-img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; margin-right: 12px; background: #282828; }
    .t-meta { flex: 1; min-width: 0; }
    .t-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-art { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .search-box { margin: 10px 16px; background: #242424; border-radius: 8px; display: flex; align-items: center; padding: 12px 14px; gap: 10px; }
    .search-box input { background: transparent; border: none; outline: none; color: #fff; font-size: 15px; width: 100%; font-weight: 600; }

    /* Spotify Мини-плеер с громкостью */
    .player { position: fixed; bottom: var(--b-nav); left: 8px; right: 8px; height: var(--p-h); background: #222; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; padding: 8px 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.9); z-index: 90; border: 1px solid var(--border); }
    .p-row { display: flex; align-items: center; gap: 10px; }
    .p-cover { width: 42px; height: 42px; border-radius: 4px; object-fit: cover; background: #181818; }
    .p-info { flex: 1; min-width: 0; }
    .p-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-artist { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-vol { display: flex; align-items: center; gap: 6px; }
    .vol-slider { width: 55px; height: 3px; -webkit-appearance: none; background: rgba(255,255,255,0.2); border-radius: 2px; cursor: pointer; outline: none; }
    .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: var(--green); cursor: pointer; }
    .p-btn { width: 36px; height: 36px; border-radius: 50%; background: transparent; color: #fff; border: none; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .p-bar { width: 100%; height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; margin-top: 6px; cursor: pointer; }
    .p-fill { height: 100%; background: var(--green); border-radius: 2px; width: 0%; }
    .p-times { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 3px; }

    .nav { position: fixed; bottom: 0; left: 0; right: 0; height: var(--b-nav); background: rgba(18,18,18,0.98); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-i { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); background: transparent; border: none; font-size: 10px; font-weight: 700; cursor: pointer; width: 25%; }
    .nav-i.active { color: #fff; }
    .nav-i svg { width: 20px; height: 20px; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-box { background: #282828; border-radius: 12px; padding: 20px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
    .modal-in { background: #3c3c3c; border: none; border-radius: 6px; padding: 10px; color: #fff; font-size: 14px; outline: none; }
  </style>
</head>
<body>

  <!-- Главная -->
  <div id="vHome">
    <div class="top-header">
      <div class="greeting" id="greet">Главная</div>
    </div>
    <div class="quick-grid" id="qGrid"></div>

    <div class="sec-head">
      <div>
        <div class="sec-title">Каталог 500 артистов</div>
        <div class="sec-sub">Переключай категории или пользуйся поиском</div>
      </div>
    </div>

    <!-- Фильтры -->
    <div class="pills">
      <button class="pill active" onclick="setCat('all', this)">🔥 Все</button>
      <button class="pill" onclick="setCat('trap_ru', this)">⚡ RU Трэп & Нью-Вейв</button>
      <button class="pill" onclick="setCat('usa', this)">🇺🇸 Мировой Трэп / USA</button>
      <button class="pill" onclick="setCat('52_melon', this)">⚓ 52 & Melon Music</button>
      <button class="pill" onclick="setCat('rock', this)">🎸 Рок, Инди & Дрейн</button>
      <button class="pill" onclick="setCat('legends', this)">👑 Легенды сцены</button>
    </div>

    <div class="scroll-row" id="artRow"></div>

    <div class="sec-head">
      <div>
        <div class="sec-title">Горячие новинки</div>
        <div class="sec-sub">madk1d, CUPSIZE, Тёмный Принц, Kai Angel</div>
      </div>
    </div>
    <div class="scroll-row" id="freshRow"></div>

    <div class="sec-head">
      <div class="sec-title">Плейлисты сообщества</div>
    </div>
    <div class="scroll-row" id="plRow"></div>
  </div>

  <!-- Чарты -->
  <div id="vCharts" style="display: none;">
    <div class="top-header"><div class="greeting">🏆 Топ-50 Чарты</div></div>
    <div style="display:flex; gap:8px; padding:0 16px 10px;">
      <button class="pill active" id="cTabT" onclick="switchChart('tracks')">Треки</button>
      <button class="pill" id="cTabA" onclick="switchChart('artists')">Все 500 артистов</button>
      <button class="pill" id="cTabP" onclick="switchChart('playlists')">Плейлисты</button>
    </div>
    <div class="t-list" id="chartList"></div>
  </div>

  <!-- Поиск -->
  <div id="vSearch" style="display: none;">
    <div class="top-header"><div class="greeting">Поиск</div></div>
    <div class="search-box">
      <svg width="18" height="18" fill="none" stroke="#fff" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input type="text" id="sInput" placeholder="Поиск среди 500 артистов и треков..." autocomplete="off">
    </div>
    <div class="t-list" id="sList"></div>
  </div>

  <!-- Медиатека -->
  <div id="vLib" style="display: none;">
    <div class="top-header">
      <div class="greeting">Моя медиатека</div>
      <button class="pill" onclick="openModal()">+ Создать</button>
    </div>
    <div style="padding:0 16px; display:grid; grid-template-columns:repeat(2,1fr); gap:12px;" id="libGrid"></div>
  </div>

  <!-- Экран артиста -->
  <div id="vArtist" style="display: none;">
    <div class="hero" id="heroBanner">
      <div class="hero-body">
        <div style="font-size:12px; color:#38bdf8; font-weight:700; margin-bottom:4px;">Подтверждённый исполнитель</div>
        <div class="hero-name" id="heroName">—</div>
        <div class="hero-stat" id="heroStat">—</div>
        <button class="play-big" onclick="playAllArt()">▶</button>
      </div>
    </div>
    <div class="sec-head"><div class="sec-title">Популярные треки</div></div>
    <div class="t-list" id="artTracks"></div>
  </div>

  <!-- Мини-плеер -->
  <div class="player" id="player" style="display: none;">
    <div class="p-row">
      <img id="pCover" class="p-cover" src="">
      <div class="p-info">
        <div class="p-title" id="pTitle">—</div>
        <div class="p-artist" id="pArtist">—</div>
      </div>
      <div class="p-vol">
        <span id="volIcon" style="cursor:pointer; font-size:14px;">🔊</span>
        <input type="range" id="volSlider" class="vol-slider" min="0" max="1" step="0.02" value="0.8">
      </div>
      <button class="p-btn" id="playBtn">▶</button>
    </div>
    <div class="p-bar" id="pBar"><div class="p-fill" id="pFill"></div></div>
    <div class="p-times"><span id="cTime">0:00</span><span id="dTime">0:00</span></div>
  </div>

  <!-- Навигация -->
  <nav class="nav">
    <button class="nav-i active" id="nHome" onclick="nav('home')"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M12.5 3.2l7.5 4.3V20h-5v-6h-4v6H6V7.5l6.5-4.3z"/></svg>Главная</button>
    <button class="nav-i" id="nSearch" onclick="nav('search')"><svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>Поиск</button>
    <button class="nav-i" id="nCharts" onclick="nav('charts')"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M5 9h3v10H5zm5-4h3v14h-3zm5 7h3v7h-3z"/></svg>Чарты</button>
    <button class="nav-i" id="nLib" onclick="nav('lib')"><svg fill="currentColor" viewBox="0 0 24 24"><path d="M3 22V3h2v19zm12.5-19.9l-4.5 18 .7 1.2 1-.7 4.5-18zm-8.5 20V3h2v19zm13 0V3h2v19z"/></svg>Медиатека</button>
  </nav>

  <!-- Модалка -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div style="font-size:18px; font-weight:800;">Новый плейлист</div>
      <input type="text" id="plName" class="modal-in" placeholder="Название">
      <input type="text" id="plDesc" class="modal-in" placeholder="Описание">
      <label style="font-size:11px; color:#aaa;">Обложка из галереи:</label>
      <input type="file" id="plFile" accept="image/*" class="modal-in" style="padding:4px;">
      <div style="display:flex; gap:8px;">
        <button class="pill" style="flex:1;" onclick="closeModal()">Отмена</button>
        <button class="pill" style="flex:1; background:var(--green); color:#000;" onclick="savePl()">Создать</button>
      </div>
    </div>
  </div>

  <audio id="audio"></audio>

      const now = new Date();
      const m = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"][now.getMonth()];
      const d = ((id * 1337 + now.getMonth() * 739) % 24) - 4;
      return `${Math.round(base * (1 + d / 100)).toLocaleString('ru-RU')} слушателей за ${m}`;

    let fullDb = [...CORE_ARTISTS];
    EXTRA_NAMES.forEach((item, idx) => {
      fullDb.push({
        id: 100 + idx,
        name: item[0],
        cat: item[1],
        base: item[2],
        query: item[0],
        img: `https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/44/21/bc/4421bc2d-3cb8-dc03-d6c6-999335a2d61c/cover.jpg/400x400bb.jpg`
      });
    });

    let currentArtList = fullDb;
    let activeArt = fullDb[0];
    let artTracks = [];
    let chartTracks = [];
    let curPlaylist = [];
    let curTrackIdx = 0;

    let playlists = JSON.parse(localStorage.getItem('sp_pl') || 'null') || [
      { id: '1', name: 'Трэп & Лоуфай 2026', desc: 'madk1d, CUPSIZE, Кишлак, Тёмный Принц', cover: fullDb[0].img },

    const hr = new Date().getHours();
    document.getElementById('greet').textContent = hr < 6 ? 'Доброй ночи' : hr < 12 ? 'Доброе утро' : hr < 18 ? 'Добрый день' : 'Добрый вечер';

    function setCat(cat, btn) {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentArtList = cat === 'all' ? fullDb : fullDb.filter(a => a.cat === cat);
      renderArtists();
    }

    function renderArtists() {
      const row = document.getElementById('artRow');
      row.innerHTML = '';
      currentArtList.forEach(a => {
        const d = document.createElement('div');
        d.className = 'artist-c';
        d.innerHTML = `<img class="artist-img" src="${a.img}" loading="lazy"><div class="artist-name">${a.name}</div>`;
        d.onclick = () => openArt(a);
        row.appendChild(d);
      });
    }

    function renderQuick() {
      const q = document.getElementById('qGrid');
      q.innerHTML = '';
      fullDb.slice(0, 6).forEach(a => {
        const el = document.createElement('div');
        el.className = 'quick-item';
        el.innerHTML = `<img class="quick-img" src="${a.img}"><div class="quick-name">${a.name}</div>`;
        el.onclick = () => openArt(a);
        q.appendChild(el);
      });
    }

    function nav(view) {
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
      document.querySelectorAll('.nav-i').forEach(b => b.classList.remove('active'));
      document.getElementById('vHome').style.display = 'none';
      document.getElementById('vCharts').style.display = 'none';
      document.getElementById('vSearch').style.display = 'none';
      document.getElementById('vLib').style.display = 'none';
      document.getElementById('vArtist').style.display = 'none';

      if (view === 'home') { document.getElementById('nHome').classList.add('active'); document.getElementById('vHome').style.display = 'block'; }
      else if (view === 'charts') { document.getElementById('nCharts').classList.add('active'); document.getElementById('vCharts').style.display = 'block'; loadChartTracks(); }
      else if (view === 'search') { document.getElementById('nSearch').classList.add('active'); document.getElementById('vSearch').style.display = 'block'; document.getElementById('sInput').focus(); }
      else if (view === 'lib') { document.getElementById('nLib').classList.add('active'); document.getElementById('vLib').style.display = 'block'; renderLib(); }
      else if (view === 'artist') { document.getElementById('vArtist').style.display = 'block'; }
    }

    // Аудио-движок поиска полных версий
    async function resolveFull(track, artist) {
      const q = `${artist} ${track} audio`;
      const mirrors = [
        `https://inv.nadeko.net/api/v1/search?q=${encodeURIComponent(q)}&type=video`,
        `https://invidious.nerdvpn.de/api/v1/search?q=${encodeURIComponent(q)}&type=video`,
        `https://yt.artemislena.eu/api/v1/search?q=${encodeURIComponent(q)}&type=video`
      ];
      for (let url of mirrors) {
        try {
          const res = await fetch(url, { signal: AbortSignal.timeout(3000) });
          const items = await res.json();
          if (items && items[0]?.videoId) {
            return `${new URL(url).origin}/latest_version?id=${items[0].videoId}&itag=140`;
          }
        } catch (e) {}
      }
      return null;
    }

    function openArt(a) {
      activeArt = a;
      nav('artist');
      document.getElementById('heroName').textContent = a.name;
      document.getElementById('heroStat').textContent = getMonthly(a.base || 1200000, a.id || 1);
      document.getElementById('heroBanner').style.backgroundImage = `url('${a.img}')`;

      const list = document.getElementById('artTracks');
      list.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;">Загружаем дискографию...</div>';

      fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(a.name)}&media=music&limit=35`)
        .then(r => r.json())
        .then(d => {
          artTracks = d.results || [];
          renderTracks(artTracks, list);
        });
    }

    function playAllArt() {
      if (artTracks.length > 0) {
        curPlaylist = artTracks;
        curTrackIdx = 0;
        playTrack(artTracks[0], (artTracks[0].artworkUrl100 || '').replace('100x100bb', '400x400bb'));
      }
    }

    function renderTracks(tracks, container, showRank = false) {
      container.innerHTML = '';
      tracks.forEach((t, i) => {
        const cover = (t.artworkUrl100 || '').replace('100x100bb', '400x400bb');
        const row = document.createElement('div');
        row.className = 't-row';
        row.innerHTML = `
          ${showRank ? `<div class="t-idx ${i < 3 ? 'top3' : ''}">${i + 1}</div>` : ''}
          <img class="t-img" src="${cover}">
          <div class="t-meta">
            <div class="t-name">${t.trackName}</div>
            <div class="t-art">${t.artistName}</div>
          </div>
          <button style="background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;" onclick="event.stopPropagation();alert('В избранном!')">♡</button>
        `;
        row.onclick = () => { curPlaylist = tracks; curTrackIdx = i; playTrack(t, cover); };
        container.appendChild(row);
      });
    }

    async function loadChartTracks() {
      const list = document.getElementById('chartList');
      list.innerHTML = '<div style="color:var(--muted);text-align:center;padding:30px;">Загрузка Топ-50...</div>';
      try {
        const res = await fetch(`https://itunes.apple.com/search?term=рэп+рок+хиты&media=music&limit=50`);
        const data = await res.json();
        chartTracks = data.results || [];
        curPlaylist = chartTracks;
        renderTracks(chartTracks, list, true);
      } catch (e) {}
    }

    function switchChart(tab) {
      const list = document.getElementById('chartList');
      if (tab === 'tracks') renderTracks(chartTracks, list, true);
      else if (tab === 'artists') {
        list.innerHTML = '';
        fullDb.forEach((a, i) => {
          const row = document.createElement('div');
          row.className = 't-row';
          row.innerHTML = `
            <div class="t-idx ${i < 3 ? 'top3' : ''}">${i + 1}</div>
            <img class="t-img" src="${a.img}" style="border-radius:50%;">
            <div class="t-meta">
              <div class="t-name">${a.name}</div>
              <div class="t-art">${getMonthly(a.base || 1000000, i + 1)}</div>
            </div>
          `;
          row.onclick = () => openArt(a);
          list.appendChild(row);
        });
      }
    }

    function renderLib() {
      const g = document.getElementById('libGrid');
      g.innerHTML = '';
      playlists.forEach(p => {
        const c = document.createElement('div');
        c.className = 'card';
        c.style.width = '100%';
        c.innerHTML = `<div class="card-wrap"><img class="card-img" src="${p.cover}"></div><div class="card-t">${p.name}</div><div class="card-d">${p.desc}</div>`;
        g.appendChild(c);
      });
    }

    function openModal() { document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function savePl() {
      const name = document.getElementById('plName').value.trim() || 'Мой плейлист';
      const desc = document.getElementById('plDesc').value.trim() || 'Плейлист';
      const file = document.getElementById('plFile').files[0];
      if (file) {
        const r = new FileReader();
        r.onload = (e) => { addPl(name, desc, e.target.result); };
        r.readAsDataURL(file);
      } else {
        addPl(name, desc, fullDb[0].img);
      }
    }
    function addPl(name, desc, cover) {
      playlists.push({ id: Date.now() + '', name, desc, cover });
      localStorage.setItem('sp_pl', JSON.stringify(playlists));
      closeModal();
      renderLib();
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    // Аудиоплеер + громкость
    const audio = document.getElementById('audio');
    const player = document.getElementById('player');
    const pCover = document.getElementById('pCover');
    const pTitle = document.getElementById('pTitle');
    const pArtist = document.getElementById('pArtist');
    const playBtn = document.getElementById('playBtn');
    const pFill = document.getElementById('pFill');
    const pBar = document.getElementById('pBar');
    const cTime = document.getElementById('cTime');
    const dTime = document.getElementById('dTime');
    const volSlider = document.getElementById('volSlider');
    const volIcon = document.getElementById('volIcon');

    let isPlaying = false;
    audio.volume = 0.8;

    volSlider.oninput = (e) => { audio.volume = e.target.value; volIcon.textContent = e.target.value == 0 ? '🔇' : '🔊'; };
    volIcon.onclick = () => { audio.volume = audio.volume > 0 ? 0 : 0.8; volSlider.value = audio.volume; volIcon.textContent = audio.volume == 0 ? '🔇' : '🔊'; };

    async function playTrack(t, cover) {
      player.style.display = 'flex';
      pTitle.textContent = t.trackName;
      pArtist.textContent = t.artistName;
      pCover.src = cover;
      cTime.textContent = '0:00';
      dTime.textContent = '...';
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      const fullUrl = await resolveFull(t.trackName, t.artistName);
      audio.src = fullUrl || t.previewUrl;
      audio.play().catch(() => {});
      isPlaying = true;
      playBtn.textContent = '⏸';
    }

    playBtn.onclick = () => {
      if (isPlaying) { audio.pause(); playBtn.textContent = '▶'; }
      else { audio.play(); playBtn.textContent = '⏸'; }
      isPlaying = !isPlaying;
    };

    audio.ontimeupdate = () => {
      if (!audio.duration) return;
      pFill.style.width = ((audio.currentTime / audio.duration) * 100) + '%';
      cTime.textContent = fmt(audio.currentTime);
      dTime.textContent = fmt(audio.duration);
    };

    pBar.onclick = (e) => {
      const pos = (e.clientX - pBar.getBoundingClientRect().left) / pBar.clientWidth;
      if (audio.duration) audio.currentTime = pos * audio.duration;
    };

    audio.onended = () => {
      if (curPlaylist.length > curTrackIdx + 1) {
        curTrackIdx++;
        const next = curPlaylist[curTrackIdx];
        playTrack(next, (next.artworkUrl100 || '').replace('100x100bb', '400x400bb'));
      }
    };

    function fmt(s) {
      if (isNaN(s)) return '0:00';
      return `${Math.floor(s / 60)}:${Math.floor(s % 60).toString().padStart(2, '0')}`;
    }

    // Живой поиск
    let st;
    document.getElementById('sInput').oninput = (e) => {
      clearTimeout(st);
      const q = e.target.value.trim();
      if (!q) return;
      st = setTimeout(async () => {
        const list = document.getElementById('sList');
        list.innerHTML = '<div style="color:var(--muted);text-align:center;padding:20px;">Ищем по всей базе...</div>';
        try {
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&limit=35`);
          const data = await res.json();
          curPlaylist = data.results || [];
          renderTracks(curPlaylist, list);
        } catch (e) {}
      }, 400);
    };

    // Старт
    renderQuick();
    renderArtists();
    renderLib();
